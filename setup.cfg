# The linters are run as "flake8 ." and "mypy ." by the Makefile, so the
# virtual environment sitting in .venv has to be excluded explicitly:
# neither tool ignores it by default, and linting the installed packages
# would drown the real warnings.

[flake8]
exclude = .git,__pycache__,.venv,venv,env,.mypy_cache,build,dist

[mypy]
exclude = (^|/)(\.venv|venv|env|build|dist)/
